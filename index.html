<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#fafafa"><meta name="apple-mobile-web-app-capable" content="yes"><title>TESTO 310 Capture</title><link rel="manifest" href="./manifest.webmanifest"><link rel="apple-touch-icon" href="./icon-192.png"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="Testo 310"><style>*{box-sizing:border-box}body{margin:0;background:#fafafa;color:#151515;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;padding:24px 16px env(safe-area-inset-bottom)}main{max-width:600px;margin:auto;border:1px solid #e2e2e2;border-radius:25px;padding:18px;background:#fafafa}header{display:flex;justify-content:space-between;align-items:center}h1{font-size:25px;font-weight:600;margin:0 0 10px}small{color:#666;font-size:17px}.count{background:#e9e9e9;border-radius:30px;padding:7px 12px;font-size:16px}.progress{display:flex;gap:5px;margin:22px 0 18px}.progress span{height:7px;flex:1;background:#e9e9e9;border-radius:8px}.progress span.active{background:#4386ef}.reading{background:#f0f0f0;border-radius:22px;padding:23px 24px;margin-bottom:18px}.eyebrow{color:#666;font-size:15px;letter-spacing:.03em}.reading h2{font-size:31px;margin:15px 0;font-weight:600}.entry{display:flex;align-items:center;gap:12px}.entry input{width:100%;min-width:0;font-size:24px;padding:13px 17px;border:1.5px solid #ccc;border-radius:30px;background:transparent;color:#151515;outline:none}.entry input:focus{border-color:#4386ef;background:white}.unit{font-size:23px;color:#666}.actions{display:flex;gap:10px}.actions button{border-radius:40px;border:1px solid #e4e4e4;padding:15px 14px;font-size:19px;background:transparent;cursor:pointer}.actions .back{flex:1}.actions .next{flex:2;background:#171717;color:white;border-color:#171717}.actions button:disabled{opacity:.4}.review{display:none}.review h2{margin:8px 0 5px}.review p{color:#666;margin:0 0 18px}.review-row{display:flex;align-items:center;justify-content:space-between;width:100%;border:1px solid #e6e6e6;border-radius:13px;padding:14px;margin:8px 0;background:#fff;font-size:16px;text-align:left}.review-row strong{font-size:17px}.review-row em{font-style:normal;color:#888;margin-left:10px}.copy,.new{width:100%;border-radius:30px;padding:16px;border:0;font-size:17px;margin-top:12px;background:#171717;color:white}.new{background:transparent;border:1px solid #ddd;color:#222}.notice{text-align:center;color:#267347;min-height:22px;font-size:14px;margin-top:12px}.hint{font-size:13px;color:#888;margin-top:18px;text-align:center}@media(max-width:370px){main{padding:15px}.reading{padding:19px}.actions button{font-size:17px}}</style></head><body><main><header><div><h1>TESTO 310</h1><small>Combustion readings</small></div><span class="count" id="count">1 of 6</span></header><div class="progress" id="progress"></div><section id="capture"><div class="reading"><div class="eyebrow">ENTER READING</div><h2 id="fieldName">O2</h2><div class="entry"><input id="readingInput" type="text" inputmode="decimal" autocomplete="off" autocorrect="off" spellcheck="false" aria-label="Reading"><span class="unit" id="unit">%</span></div></div><div class="actions"><button class="back" id="back">← &nbsp;Back</button><button class="next" id="next">Next &nbsp;→</button></div></section><section class="review" id="review"><h2>Review readings</h2><p>Tap any reading to make a correction.</p><div id="reviewRows"></div><button class="copy" id="copy">Copy Results</button><button class="new" id="new">New Analysis</button><div class="notice" id="notice" role="status"></div></section><div class="hint">Your readings stay saved until you start a new analysis.</div></main><script>const fields=[['O2','%'],['CO','ppm'],['Fluegas Temp','F'],['Excess Air','%'],['CO2','%'],['Undiluted CO','ppm']];const storageKey='testo310-capture-v1';let saved;try{saved=JSON.parse(localStorage.getItem(storageKey)||'null')}catch{}let values=Array.isArray(saved?.values)&&saved.values.length===6?saved.values.map(String):Array(6).fill('');let step=Number.isInteger(saved?.step)&&saved.step>=0&&saved.step<6?saved.step:0;let reviewing=!!saved?.reviewing;const el=id=>document.getElementById(id);function persist(){try{localStorage.setItem(storageKey,JSON.stringify({values,step,reviewing}))}catch{}}function render(){el('count').textContent=reviewing?'Review':`${step+1} of 6`;el('progress').innerHTML=fields.map((_,i)=>`<span class="${reviewing||i<=step?'active':''}"></span>`).join('');el('capture').style.display=reviewing?'none':'block';el('review').style.display=reviewing?'block':'none';if(reviewing){el('reviewRows').replaceChildren();fields.forEach(([name,unit],i)=>{const b=document.createElement('button');b.className='review-row';const label=document.createElement('span');label.textContent=name;const v=document.createElement('strong');v.textContent=`${values[i]||'Not entered'} ${values[i]?unit:''}  ✎`;b.append(label,v);b.onclick=()=>{step=i;reviewing=false;persist();render()};el('reviewRows').append(b)});}else{el('fieldName').textContent=fields[step][0];el('unit').textContent=fields[step][1];el('readingInput').value=values[step];el('back').disabled=step===0;el('next').textContent=step===5?'Review →':'Next →';}persist()}el('readingInput').addEventListener('input',e=>{values[step]=e.target.value;persist()});el('back').onclick=()=>{if(step>0){step--;render()}};el('next').onclick=()=>{if(!values[step].trim()){el('readingInput').focus();return}if(step<5)step++;else reviewing=true;render()};el('readingInput').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();el('next').click();el('readingInput').blur()}});el('copy').onclick=async()=>{const result=fields.map(([name,unit],i)=>`${name}: ${values[i]}${unit==='%'?'%':' '+unit}`).join('\n');try{await navigator.clipboard.writeText(result);el('notice').textContent='Results copied to clipboard.'}catch{const t=document.createElement('textarea');t.value=result;t.style.position='fixed';t.style.opacity='0';document.body.append(t);t.select();let ok=false;try{ok=document.execCommand('copy')}catch{}t.remove();el('notice').textContent=ok?'Results copied to clipboard.':'Clipboard unavailable. Open this app over HTTPS.'}};el('new').onclick=()=>{if(!confirm('Start a new analysis? This will clear all six saved readings.'))return;values=Array(6).fill('');step=0;reviewing=false;el('notice').textContent='';render()};render();</script><script>if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));}</script></body></html>
